<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albatross Wings - Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-bg: #0f172a;
      --sidebar-active: #2563eb;
      --sidebar-text: #94a3b8;
      --body-bg: #f8fafc;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--body-bg);
      color: var(--text-dark);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-brand {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .brand-icon {
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .brand-name { font-weight: 700; font-size: 0.95rem; }

    .sidebar-menu {
      list-style: none;
      padding: 16px 12px;
      margin: 0;
      flex-grow: 1;
    }

    .sidebar-item { margin-bottom: 4px; }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 8px;
    }

    .sidebar-link:hover { color: #ffffff; background: rgba(255,255,255,0.05); }
    .sidebar-link.active { background: var(--sidebar-active); color: #ffffff; font-weight: 600; }

    .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }

    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title { font-size: 1.2rem; font-weight: 700; margin: 0; }
    .page-subtitle { font-size: 0.78rem; color: var(--text-muted); margin: 0; }

    .pill-live {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; }

    .content-area { padding: 24px 28px; flex-grow: 1; overflow-y: auto; }

    .stat-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 20px;
      height: 100%;
    }

    .stat-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
    .stat-subtext { font-size: 0.72rem; color: var(--text-muted); }

    .card-table-box {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .table-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 16px; }

    .custom-table { width: 100%; font-size: 0.82rem; border-collapse: separate; border-spacing: 0; }
    .custom-table th { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
    .custom-table td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">AW</span>
      <span class="brand-name">Albatross Wings</span>
    </div>
    <ul class="sidebar-menu" id="sidebarMenu">
      <li class="sidebar-item"><a href="#" class="sidebar-link active" onclick="navTo('Dashboard')"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('Performance Card')"><i class="bi bi-person-vcard-fill"></i> Performance Card</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('FCR & service delivery')"><i class="bi bi-layers-fill"></i> FCR & service delivery</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('Agent Performance')"><i class="bi bi-person-badge-fill"></i> Agent Performance</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('Empathy Analysis')"><i class="bi bi-heart-pulse-fill"></i> Empathy Analysis</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('Adherence & Break')"><i class="bi bi-clock-history"></i> Adherence & Break</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('AHT & CFS')"><i class="bi bi-pie-chart-fill"></i> AHT & CFS</a></li>
      <li class="sidebar-item"><a href="#" class="sidebar-link" onclick="navTo('Audit Log')"><i class="bi bi-table"></i> Audit Log</a></li>
    </ul>
  </div>

  <div class="main-wrapper">
    <div class="top-bar">
      <div>
        <h1 class="page-title" id="hdrTitle">Dashboard Overview</h1>
        <p class="page-subtitle" id="hdrSub">Team performance summary</p>
      </div>
      <div class="pill-live">
        <span class="pill-dot"></span>
        <span id="liveMeta">Live - loading...</span>
      </div>
    </div>

    <div class="content-area" id="mainContent">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted small">Loading data.json...</p>
      </div>
    </div>
  </div>

  <script>
    let appData = null;
    let activeTab = 'Dashboard';

    async function loadDashboard() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        appData = await res.json();

        if (appData.lastUpdated) {
          const dt = new Date(appData.lastUpdated);
          document.getElementById('liveMeta').innerText = `Live - updated ${dt.toLocaleTimeString()} · ${appData.activeAgentsCount || 0} roster agents`;
        }

        renderView(activeTab);
      } catch (err) {
        console.error(err);
        document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger">Failed to load data.json</div>`;
      }
    }

    function navTo(tabName) {
      activeTab = tabName;
      document.querySelectorAll('#sidebarMenu .sidebar-link').forEach(link => {
        link.classList.toggle('active', link.innerText.includes(tabName));
      });
      renderView(tabName);
    }

    function renderView(tabName) {
      const container = document.getElementById('mainContent');
      const hdrTitle = document.getElementById('hdrTitle');
      const hdrSub = document.getElementById('hdrSub');

      if (!appData || !appData.sheets) return;

      // 1. DASHBOARD
      if (tabName === 'Dashboard') {
        hdrTitle.innerText = "Dashboard Overview";
        hdrSub.innerText = "Team performance summary";
        container.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Total Audits</div><div class="stat-value">190</div></div></div>
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Pass Rate</div><div class="stat-value text-success">85.3%</div></div></div>
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Fail Rate</div><div class="stat-value text-danger">14.7%</div></div></div>
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Empathy Pass</div><div class="stat-value">85.4%</div></div></div>
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Critical Free</div><div class="stat-value">86.3%</div></div></div>
            <div class="col-6 col-md-2"><div class="stat-card"><div class="stat-title">Audited Agents</div><div class="stat-value">${appData.activeAgentsCount || 20}</div></div></div>
          </div>`;
        return;
      }

      // 2. ADHERENCE & BREAK (ORT Data Source)
      if (tabName === 'Adherence & Break') {
        hdrTitle.innerText = "Adherence & Break";
        hdrSub.innerText = "From ORT — team adherence includes all, table shows roster only";
        
        container.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Team Avg Adherence</div><div class="stat-value">91.9%</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Agents with Over Break</div><div class="stat-value text-warning">7</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Agents with Lag</div><div class="stat-value text-danger">23</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Total Lag Hours</div><div class="stat-value">142.9h</div></div></div>
          </div>
          <div class="card-table-box">
            <div class="table-title">Agent-wise Adherence, Over Break & Lag Hour</div>
            <div class="table-responsive">${renderGenericTable(appData.sheets['Adherence & Break'] || [])}</div>
          </div>`;
        return;
      }

      // 3. AHT & CFS (ORT Data Source)
      if (tabName === 'AHT & CFS') {
        hdrTitle.innerText = "AHT & CFS";
        hdrSub.innerText = "From ORT — team AHT/CFS includes all";
        
        container.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Team Avg AHT</div><div class="stat-value">202.7s</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">AHT Target Met</div><div class="stat-value">3/26</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">Team Avg CFS</div><div class="stat-value text-success">90.6%</div></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-title">CFS Target Met</div><div class="stat-value">10/14</div></div></div>
          </div>
          <div class="card-table-box">
            <div class="table-title">Agent-wise AHT & CFS</div>
            <div class="table-responsive">${renderGenericTable(appData.sheets['AHT & CFS'] || [])}</div>
          </div>`;
        return;
      }

      // 4. AUDIT LOG (IB Agent Wise Raw Data)
      if (tabName === 'Audit Log') {
        hdrTitle.innerText = "Audit Log";
        hdrSub.innerText = "Raw call-level audit records";
        
        container.innerHTML = `
          <div class="card-table-box">
            <div class="table-title">Call Audits Log</div>
            <div class="table-responsive">${renderGenericTable(appData.sheets['Audit Log'] || [])}</div>
          </div>`;
        return;
      }

      // DEFAULT TAB RENDER
      hdrTitle.innerText = tabName;
      hdrSub.innerText = `Data table for ${tabName}`;
      container.innerHTML = `
        <div class="card-table-box">
          <div class="table-title">${tabName} Table</div>
          <div class="table-responsive">${renderGenericTable(appData.sheets[tabName] || [])}</div>
        </div>`;
    }

    function renderGenericTable(data) {
      if (!data || data.length === 0) return '<div class="text-muted p-3">No records found. Please run Apps Script sync.</div>';
      const keys = Object.keys(data[0]);
      let html = `<table class="custom-table"><thead><tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>`;
      data.forEach(row => {
        html += `<tr>${keys.map(k => `<td>${row[k] !== undefined ? row[k] : ''}</td>`).join('')}</tr>`;
      });
      html += `</tbody></table>`;
      return html;
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
