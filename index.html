<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Albatross Wings - Enterprise SaaS Dashboard</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 270px;
      --bg-midnight: #0b0f19;
      --bg-surface: #f8fafc;
      --card-bg: #ffffff;
      --accent-indigo: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-subtle: #e2e8f0;
      --shadow-premium: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.01);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-surface);
      color: var(--text-main);
      margin: 0;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center !important; /* GLOBAL CENTERED TEXT */
    }

    /* Left Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-midnight);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 1050;
      transition: transform 0.3s ease;
      text-align: center;
    }

    .brand-box {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 700; font-size: 1.1rem; color: #ffffff;
    }

    .sidebar-menu { list-style: none; padding: 18px 12px; margin: 0; flex-grow: 1; overflow-y: auto; }

    .sidebar-link {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 11px 14px; color: #94a3b8;
      text-decoration: none; font-size: 0.86rem; font-weight: 600;
      border-radius: 12px; margin-bottom: 6px; transition: all 0.2s ease;
    }

    .sidebar-link:hover { color: #ffffff; background: rgba(255, 255, 255, 0.05); }
    .sidebar-link.active {
      background: var(--accent-indigo); color: #ffffff;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }

    /* Main Area */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex-grow: 1; display: flex; flex-direction: column;
      min-width: 0; width: 100%; text-align: center !important;
    }

    .top-header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 18px 32px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: sticky; top: 0; z-index: 1000; gap: 6px;
    }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .page-sub { font-size: 0.82rem; color: var(--text-sub); margin: 0; }

    .live-badge {
      background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857;
      font-size: 0.76rem; font-weight: 700; padding: 5px 14px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    }

    .content-area { padding: 28px 32px; overflow-y: auto; flex-grow: 1; text-align: center !important; }

    /* KPI Cards */
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 16px; padding: 20px;
      box-shadow: var(--shadow-premium);
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center !important;
    }

    .kpi-title {
      font-size: 0.76rem; font-weight: 700; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    .kpi-value {
      font-family: 'Outfit', sans-serif; font-size: 1.65rem; font-weight: 800;
      color: var(--text-main); margin: 6px 0 2px 0; text-align: center;
    }

    /* Container Box Wrappers */
    .table-box {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 18px; padding: 24px;
      box-shadow: var(--shadow-premium); margin-top: 24px;
      text-align: center !important;
    }

    .custom-table { width: 100%; font-size: 0.85rem; border-collapse: separate; border-spacing: 0; margin: 0 auto; }
    .custom-table th {
      color: var(--text-sub); font-size: 0.74rem; font-weight: 700;
      text-transform: uppercase; padding: 12px 16px; border-bottom: 2px solid var(--border-subtle);
      background: #f8fafc; text-align: center !important;
    }

    .custom-table td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; color: var(--text-main); font-weight: 500; text-align: center !important; }
    .custom-table tr:hover td { background: #f8fafc; }

    .mobile-toggle {
      display: none; background: #f1f5f9; border: 1px solid var(--border-subtle);
      padding: 8px 12px; border-radius: 10px; color: var(--text-main); margin-bottom: 8px;
    }

    @media (max-width: 991px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.show { transform: translateX(0); }
      .main-wrapper { margin-left: 0; }
      .mobile-toggle { display: inline-flex; }
      .content-area { padding: 18px 14px; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <div class="sidebar" id="sidebar">
    <div class="brand-box">
      <div class="brand-logo"><i class="bi bi-shield-check"></i></div>
      <div class="brand-name">Albatross Wings</div>
    </div>
    <ul class="sidebar-menu" id="sidebarMenu">
      <li><a href="#" class="sidebar-link active" onclick="nav('Dashboard')"><i class="bi bi-grid-fill text-indigo"></i> Dashboard</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Performance Card')"><i class="bi bi-person-badge-fill text-primary"></i> Performance Card</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Audit Details')"><i class="bi bi-card-checklist text-info"></i> Audit Details</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Parameter wise Empathy')"><i class="bi bi-heart-pulse-fill text-danger"></i> Parameter Empathy</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('FCR & Service Delivery')"><i class="bi bi-layers-fill text-success"></i> FCR & Service Delivery</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Complaint Escalation and DKB %')"><i class="bi bi-exclamation-triangle-fill text-warning"></i> Complaint & DKB %</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Lag Adherence & Over Break')"><i class="bi bi-clock-history text-secondary"></i> Lag & Adherence</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('AHT & CFS')"><i class="bi bi-pie-chart-fill text-indigo"></i> AHT & CFS</a></li>
      <li><a href="#" class="sidebar-link" onclick="nav('Audited Call Details')"><i class="bi bi-telephone-fill text-primary"></i> Audited Call Details</a></li>
    </ul>
  </div>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <div class="top-header">
      <button class="mobile-toggle" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i> Menu</button>
      <h1 class="page-title" id="pageTitle"><i class="bi bi-speedometer2 text-indigo"></i> Dashboard</h1>
      <p class="page-sub" id="pageSub">Team performance summary</p>
      <div class="live-badge" id="liveBadge">● Live Data</div>
    </div>

    <div class="content-area" id="mainView">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted small fw-bold">Loading enterprise data.json...</p>
      </div>
    </div>
  </div>

  <script>
    let appData = null;
    let currentTab = 'Dashboard';

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

    async function loadData() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        appData = await res.json();
        
        if (appData.lastUpdated) {
          const dt = new Date(appData.lastUpdated);
          document.getElementById('liveBadge').innerHTML = `● Live Sync: ${dt.toLocaleTimeString()} (${appData.activeAgentsCount || 0} Active Agents)`;
        }

        render(currentTab);
      } catch (err) {
        console.error(err);
        document.getElementById('mainView').innerHTML = `<div class="alert alert-danger">Failed to load data.json. Ensure Apps Script sync has executed.</div>`;
      }
    }

    function nav(tabName) {
      currentTab = tabName;
      document.querySelectorAll('#sidebarMenu .sidebar-link').forEach(l => {
        l.classList.toggle('active', l.innerText.includes(tabName));
      });
      document.getElementById('sidebar').classList.remove('show');
      render(tabName);
    }

    function render(tab) {
      const view = document.getElementById('mainView');
      const title = document.getElementById('pageTitle');
      const sub = document.getElementById('pageSub');

      if (!appData) return;

      // 1. DASHBOARD OVERVIEW WITH LEADERBOARDS
      if (tab === 'Dashboard') {
        title.innerHTML = `<i class="bi bi-speedometer2 text-primary"></i> TL Performance Overview`;
        sub.innerText = "Supervisor: Mohammad Imam Hossain";
        const tl = appData.tlSummary || {};
        const lb = appData.leaderboards || {};

        view.innerHTML = `
          <!-- Top TL KPI Cards Grid -->
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-hash text-indigo"></i> Total Audits</div><div class="kpi-value">${tl.totalAudit || 0}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-check-circle-fill text-success"></i> Pass / Pass %</div><div class="kpi-value text-success">${tl.totalPass || 0} (${tl.passPercent || '0%'})</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-x-circle-fill text-danger"></i> Total Fail</div><div class="kpi-value text-danger">${tl.totalFail || 0}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-heart-fill text-info"></i> Total Empathy Pass</div><div class="kpi-value text-info">${tl.totalEmpathyPass || 0}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-pie-chart-fill text-primary"></i> Team CFS %</div><div class="kpi-value">${tl.teamCfs || 'N/A'}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-clock-fill text-warning"></i> Team AHT</div><div class="kpi-value">${tl.aht || 'N/A'}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-graph-up-arrow text-success"></i> Team FCR %</div><div class="kpi-value">${tl.fcr || 'N/A'}</div></div></div>
            <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-exclamation-triangle-fill text-danger"></i> Complaints / SD</div><div class="kpi-value">${tl.complaintEscalation || 0} / ${tl.sdCount || 0}</div></div></div>
          </div>

          <!-- Agent Leaderboards Section -->
          <div class="table-box">
            <h4 class="fw-bold fs-5 mb-4 text-center"><i class="bi bi-trophy-fill text-warning me-2"></i> Agent Leaderboard (Top 05 Highlights)</h4>
            <div class="row g-3">
              
              <!-- Top 5 CFS -->
              <div class="col-12 col-md-6 col-lg-3">
                <div class="kpi-card p-3">
                  <div class="fw-bold text-primary mb-2"><i class="bi bi-award-fill text-warning"></i> TOP 05 CFS</div>
                  <table class="custom-table">
                    <thead><tr><th>#</th><th>AGENT</th><th>CFS %</th></tr></thead>
                    <tbody>
                      ${(lb.topCfs || []).map((a, i) => `<tr><td>${i+1}</td><td>${a.agentName}</td><td class="fw-bold text-success">${a.cfsDisplay}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Top 5 AHT (Fastest) -->
              <div class="col-12 col-md-6 col-lg-3">
                <div class="kpi-card p-3">
                  <div class="fw-bold text-info mb-2"><i class="bi bi-lightning-charge-fill text-warning"></i> TOP 05 AHT</div>
                  <table class="custom-table">
                    <thead><tr><th>#</th><th>AGENT</th><th>AHT</th></tr></thead>
                    <tbody>
                      ${(lb.topAht || []).map((a, i) => `<tr><td>${i+1}</td><td>${a.agentName}</td><td class="fw-bold text-info">${a.ahtDisplay}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Top 5 Empathy -->
              <div class="col-12 col-md-6 col-lg-3">
                <div class="kpi-card p-3">
                  <div class="fw-bold text-danger mb-2"><i class="bi bi-heart-fill text-danger"></i> TOP 05 EMPATHY</div>
                  <table class="custom-table">
                    <thead><tr><th>#</th><th>AGENT</th><th>EMPATHY%</th></tr></thead>
                    <tbody>
                      ${(lb.topEmpathy || []).map((a, i) => `<tr><td>${i+1}</td><td>${a.agentName}</td><td class="fw-bold text-danger">${a.empathyDisplay}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Top 5 CE -->
              <div class="col-12 col-md-6 col-lg-3">
                <div class="kpi-card p-3">
                  <div class="fw-bold text-warning mb-2"><i class="bi bi-exclamation-octagon-fill text-danger"></i> TOP 05 CE HOLDERS</div>
                  <table class="custom-table">
                    <thead><tr><th>#</th><th>AGENT</th><th>CE FAILS</th></tr></thead>
                    <tbody>
                      ${(lb.topCe || []).map((a, i) => `<tr><td>${i+1}</td><td>${a.agentName}</td><td class="fw-bold text-danger">${a.ceCount}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          </div>`;
        return;
      }

      // 2. PERFORMANCE CARD
      if (tab === 'Performance Card') {
        title.innerHTML = `<i class="bi bi-person-badge-fill text-primary"></i> Active Agent Performance Card`;
        sub.innerText = "Select active agent to view detailed card";
        const list = appData.sheets['Performance Card'] || [];

        let selectHtml = `<div class="table-box mb-4">
          <label class="fw-bold mb-2 small text-muted"><i class="bi bi-filter text-indigo"></i> SELECT ACTIVE AGENT:</label>
          <select class="form-select w-auto fw-bold mx-auto text-center" onchange="renderAgentCard(this.value)">
            ${list.map(a => `<option value="${a.name}">${a.name}</option>`).join('')}
          </select>
        </div><div id="cardBox"></div>`;

        view.innerHTML = selectHtml;
        if (list.length > 0) renderAgentCard(list[0].name);
        return;
      }

      // 3. AUDIT DETAILS
      if (tab === 'Audit Details') {
        title.innerHTML = `<i class="bi bi-card-checklist text-info"></i> Audit Details`;
        sub.innerText = "Active Agents Audit Performance & Empathy Sums";
        const details = appData.sheets['Audit Details'] || { summary: {}, list: [] };

        view.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-x-circle-fill text-danger"></i> Agents with Audit Fail</div><div class="kpi-value text-danger">${details.summary.failAgentCount || 0}</div></div></div>
            <div class="col-6 col-md-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-exclamation-circle-fill text-warning"></i> Empathy Target Not Met (<87.50%)</div><div class="kpi-value text-warning">${details.summary.empathyTargetBelowCount || 0}</div></div></div>
          </div>
          <div class="table-box">
            <h5 class="fw-bold fs-6 mb-3"><i class="bi bi-table text-indigo"></i> Active Agent Audit Summary</h5>
            <div class="table-responsive">
              <table class="custom-table">
                <thead><tr><th>AGENT NAME</th><th>TOTAL AUDIT</th><th>PASS</th><th>FAIL</th><th>CE% (FAIL RATE)</th><th>EMPATHY PASS (SUM)</th><th>EMPATHY FAIL (SUM)</th><th>EMPATHY PASS%</th></tr></thead>
                <tbody>
                  ${details.list.map(a => `
                    <tr>
                      <td class="fw-bold">${a.agentName}</td>
                      <td>${a.totalAudits}</td>
                      <td class="text-success fw-bold">${a.totalPass}</td>
                      <td class="text-danger fw-bold">${a.totalFail}</td>
                      <td class="text-danger fw-bold">${a.cePercent}</td>
                      <td class="text-primary fw-bold">${a.empathyPass}</td>
                      <td class="text-secondary">${a.empathyFail}</td>
                      <td class="${parseFloat(a.empathyPassPercent) >= 87.5 ? 'text-success' : 'text-danger'} fw-bold">${a.empathyPassPercent}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
        return;
      }

      // 4. PARAMETER WISE EMPATHY
      if (tab === 'Parameter wise Empathy') {
        title.innerHTML = `<i class="bi bi-heart-pulse-fill text-danger"></i> Parameter wise Empathy`;
        sub.innerText = "Team Average 8 Empathy Parameters & Active Agents Breakdown";
        const emp = appData.sheets['Parameter wise Empathy'] || { teamAvg: {}, agentList: [] };

        let kpiHtml = `<div class="row g-2 mb-4">`;
        Object.keys(emp.teamAvg).forEach(p => {
          kpiHtml += `<div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-check2-square text-indigo"></i> ${p}</div><div class="kpi-value text-primary">${emp.teamAvg[p]}</div></div></div>`;
        });
        kpiHtml += `</div>`;

        let tableHtml = `<div class="table-box"><h5 class="fw-bold fs-6 mb-3"><i class="bi bi-grid-3x3 text-indigo"></i> Active Agent Empathy Scores</h5><div class="table-responsive"><table class="custom-table"><thead><tr><th>AGENT NAME</th>`;
        const headers = ['Warm Greetings', 'Acknowledgment & Understanding', 'Speech Clarity / Communication', 'Proper Listening', 'Personalization', 'Time / Hold Management', 'Emotional Tone with Courtesy', 'Closing Courtesy'];
        headers.forEach(h => tableHtml += `<th>${h}</th>`);
        tableHtml += `</tr></thead><tbody>`;

        emp.agentList.forEach(a => {
          tableHtml += `<tr><td class="fw-bold">${a.agentName}</td>`;
          headers.forEach(h => tableHtml += `<td>${a[h] || 'N/A'}</td>`);
          tableHtml += `</tr>`;
        });
        tableHtml += `</tbody></table></div></div>`;

        view.innerHTML = kpiHtml + tableHtml;
        return;
      }

      // 5. FCR & SERVICE DELIVERY
      if (tab === 'FCR & Service Delivery') {
        title.innerHTML = `<i class="bi bi-layers-fill text-success"></i> FCR & Service Delivery`;
        sub.innerText = "Empathy Target >=92% & Service Delivery Counts";
        const fcrSd = appData.sheets['FCR & Service Delivery'] || { summary: {}, list: [] };

        view.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6 col-md-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-award-fill text-success"></i> Empathy Target Met (>= 92%)</div><div class="kpi-value text-success">${fcrSd.summary.empathyMeet92Count || 0}</div></div></div>
            <div class="col-6 col-md-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-truck text-info"></i> Agents with Service Delivery</div><div class="kpi-value text-info">${fcrSd.summary.agentsWithSdCount || 0}</div></div></div>
          </div>
          <div class="table-box"><div class="table-responsive"><table class="custom-table"><thead><tr><th>AGENT NAME</th><th>VDI ID</th><th>FCR %</th><th>SERVICE DELIVERY COUNT</th></tr></thead><tbody>
          ${fcrSd.list.map(a => `<tr><td class="fw-bold">${a.agentName}</td><td>${a.vdiId}</td><td>${a.fcrPercent}</td><td>${a.serviceDeliveryCount}</td></tr>`).join('')}
          </tbody></table></div></div>`;
        return;
      }

      // 6. NEW SHEET: COMPLAINT ESCALATION AND DKB %
      if (tab === 'Complaint Escalation and DKB %') {
        title.innerHTML = `<i class="bi bi-exclamation-triangle-fill text-warning"></i> Complaint Escalation & DKB %`;
        sub.innerText = "Active Agents Complaint Escalation & Attendance DKB %";
        const list = appData.sheets['Complaint Escalation and DKB %'] || [];

        view.innerHTML = `
          <div class="row g-3">
            <div class="col-12 col-lg-6">
              <div class="table-box">
                <h5 class="fw-bold fs-6 mb-3 text-warning"><i class="bi bi-file-earmark-text-fill me-2"></i> Complaint Escalation Table</h5>
                <div class="table-responsive">
                  <table class="custom-table">
                    <thead><tr><th>AGENT NAME</th><th>VALID</th><th>INVALID</th><th>TOTAL</th><th>ESCALATION %</th></tr></thead>
                    <tbody>
                      ${list.map(a => `<tr><td class="fw-bold">${a.agentName}</td><td class="text-success fw-bold">${a.valid}</td><td class="text-danger fw-bold">${a.invalid}</td><td>${a.totalComplaints}</td><td class="fw-bold text-primary">${a.escalationPercent}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="table-box">
                <h5 class="fw-bold fs-6 mb-3 text-info"><i class="bi bi-calendar-check-fill me-2"></i> DKB % Attendance Table</h5>
                <div class="table-responsive">
                  <table class="custom-table">
                    <thead><tr><th>AGENT NAME</th><th>PRESENT</th><th>ABSENT</th><th>DKB % (PRESENT%)</th><th>HEALTH</th></tr></thead>
                    <tbody>
                      ${list.map(a => `<tr><td class="fw-bold">${a.agentName}</td><td class="text-success fw-bold">${a.present}</td><td class="text-danger fw-bold">${a.absent}</td><td class="fw-bold text-info">${a.dkbPercent}</td><td>${a.health}</td></tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>`;
        return;
      }

      // 7. LAG ADHERENCE & OVER BREAK
      if (tab === 'Lag Adherence & Over Break') {
        title.innerHTML = `<i class="bi bi-clock-history text-secondary"></i> Lag Adherence & Over Break`;
        sub.innerText = "Adherence Target = 100%";
        const lagAdh = appData.sheets['Lag Adherence & Over Break'] || { summary: {}, list: [] };

        view.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-4"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-cup-hot-fill text-warning"></i> Over Break</div><div class="kpi-value text-warning">${lagAdh.summary.overBreakCount || 0}</div></div></div>
            <div class="col-4"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-hourglass-split text-danger"></i> Lag Count</div><div class="kpi-value text-danger">${lagAdh.summary.lagCount || 0}</div></div></div>
            <div class="col-4"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-slash-circle-fill text-danger"></i> Adherence < 100%</div><div class="kpi-value text-danger">${lagAdh.summary.adhNotMetCount || 0}</div></div></div>
          </div>
          <div class="table-box"><div class="table-responsive"><table class="custom-table"><thead><tr><th>AGENT NAME</th><th>ADHERENCE %</th><th>EXTRA BREAK</th><th>LAG TIME</th><th>READY TIME</th></tr></thead><tbody>
          ${lagAdh.list.map(a => `<tr><td class="fw-bold">${a.agentName}</td><td>${a.adherence}</td><td>${a.extraBreak}</td><td>${a.lagTime}</td><td>${a.readyTime}</td></tr>`).join('')}
          </tbody></table></div></div>`;
        return;
      }

      // 8. AHT & CFS
      if (tab === 'AHT & CFS') {
        title.innerHTML = `<i class="bi bi-pie-chart-fill text-indigo"></i> AHT & CFS`;
        sub.innerText = "AHT Target <=170s | CFS Target >=90%";
        const ahtCfs = appData.sheets['AHT & CFS'] || { summary: {}, list: [] };

        view.innerHTML = `
          <div class="row g-3 mb-4">
            <div class="col-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-speedometer text-success"></i> AHT Target Met (<=170s)</div><div class="kpi-value text-success">${ahtCfs.summary.ahtMetCount || 0}</div></div></div>
            <div class="col-6"><div class="kpi-card"><div class="kpi-title"><i class="bi bi-check-all text-success"></i> CFS Target Met (>=90%)</div><div class="kpi-value text-success">${ahtCfs.summary.cfsMetCount || 0}</div></div></div>
          </div>
          <div class="table-box"><div class="table-responsive"><table class="custom-table"><thead><tr><th>AGENT NAME</th><th>AHT (SEC)</th><th>AHT STATUS</th><th>CFS %</th><th>CFS STATUS</th></tr></thead><tbody>
          ${ahtCfs.list.map(a => `<tr><td class="fw-bold">${a.agentName}</td><td>${a.ahtSec}</td><td><span class="badge ${a.ahtStatus === 'Target Met' ? 'bg-success' : 'bg-warning'}">${a.ahtStatus}</span></td><td>${a.cfsPercent}</td><td><span class="badge ${a.cfsStatus === 'Target Met' ? 'bg-success' : 'bg-secondary'}">${a.cfsStatus}</span></td></tr>`).join('')}
          </tbody></table></div></div>`;
        return;
      }

      // 9. AUDITED CALL DETAILS
      if (tab === 'Audited Call Details') {
        title.innerHTML = `<i class="bi bi-telephone-fill text-primary"></i> Audited Call Details`;
        sub.innerText = "Raw Call Audit Records for Active Agents";
        const calls = appData.sheets['Audited Call Details'] || [];

        view.innerHTML = `
          <div class="table-box">
            <div class="row g-2 mb-3">
              <div class="col-12 col-md-6"><input type="text" id="callSearch" class="form-control form-control-sm text-center" placeholder="Search Agent, ANI, Topic..." oninput="filterCalls()"></div>
              <div class="col-12 col-md-6">
                <select id="resultFilter" class="form-select form-select-sm text-center" onchange="filterCalls()">
                  <option value="">All Results (Pass & Fail)</option>
                  <option value="pass">Pass Only</option>
                  <option value="fail">Fail Only</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="custom-table" id="callTable">
                <thead><tr><th>AGENT NAME</th><th>CONTACT DATE</th><th>AUDIT PARTY</th><th>ANI</th><th>TOPIC</th><th>FAIL REMARKS</th><th>RESULT</th></tr></thead>
                <tbody id="callBody">
                  ${renderCallRows(calls)}
                </tbody>
              </table>
            </div>
          </div>`;
        return;
      }
    }

    function renderAgentCard(agentName) {
      const list = appData.sheets['Performance Card'] || [];
      const agent = list.find(a => a.name === agentName);
      const box = document.getElementById('cardBox');

      if (!agent) { box.innerHTML = ''; return; }

      box.innerHTML = `
        <div class="kpi-card p-4 mx-auto" style="max-width: 800px;">
          <div class="border-bottom pb-3 mb-3">
            <h3 class="fw-extrabold text-primary mb-1">${agent.name}</h3>
            <div class="text-muted small fw-bold">ID: ${agent.id} | VDI ID: ${agent.vdiId} | Supervisor: ${agent.supervisor}</div>
            <span class="badge bg-success mt-2">Active Agent</span>
          </div>
          <div class="row g-3">
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">AHT</small><span class="fw-bold fs-6">${agent.aht}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">ADHERENCE %</small><span class="fw-bold fs-6">${agent.adherence}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">LOGIN COMPLIANCE</small><span class="fw-bold fs-6">${agent.loginCompliance}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">FCR %</small><span class="fw-bold fs-6">${agent.fcr}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">EMPATHY PASS</small><span class="fw-bold fs-6 text-success">${agent.empathyPass}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">GP SCORE</small><span class="fw-bold fs-6">${agent.gpScore}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">PRESENT % (DKB)</small><span class="fw-bold fs-6">${agent.presentPercent}</span></div></div>
            <div class="col-6 col-md-3"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">HEALTH</small><span class="fw-bold fs-6">${agent.health}</span></div></div>
            <div class="col-6 col-md-6"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">SERVICE DELIVERY COUNT</small><span class="fw-bold fs-6 text-info">${agent.sdCount}</span></div></div>
            <div class="col-6 col-md-6"><div class="p-3 bg-light rounded-3"><small class="text-muted d-block fw-bold">COMPLAINT TICKETS</small><span class="fw-bold fs-6 text-danger">${agent.complaintCount}</span></div></div>
          </div>
        </div>`;
    }

    function renderCallRows(calls) {
      return calls.map(c => `
        <tr>
          <td class="fw-bold">${c.agentName}</td>
          <td>${c.contactDate}</td>
          <td>${c.auditParty}</td>
          <td>${c.ani}</td>
          <td>${c.callTopic}</td>
          <td class="text-danger">${c.failTopic}</td>
          <td><span class="badge ${String(c.result).toLowerCase() === 'pass' ? 'bg-success' : 'bg-danger'}">${c.result}</span></td>
        </tr>`).join('');
    }

    function filterCalls() {
      const q = document.getElementById('callSearch').value.toLowerCase();
      const resFilter = document.getElementById('resultFilter').value.toLowerCase();
      const calls = appData.sheets['Audited Call Details'] || [];

      const filtered = calls.filter(c => {
        const matchQ = JSON.stringify(c).toLowerCase().includes(q);
        const matchRes = !resFilter || String(c.result).toLowerCase() === resFilter;
        return matchQ && matchRes;
      });

      document.getElementById('callBody').innerHTML = renderCallRows(filtered);
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
